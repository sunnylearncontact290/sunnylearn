name: SunnyLearn iOS Cloud Build (TestFlight)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'iOS Build Number (e.g. 1, 2, 3)'
        required: false
        default: '1'
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-and-deploy:
    name: Build iOS IPA & Upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App (Vite)
        run: npm run build

      - name: Sync Capacitor iOS Container
        run: npx cap sync ios

      - name: Select Xcode 15/16
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # 1. Create temporary build keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # 2. Decode and import distribution certificate
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          # 3. Decode and install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Update Marketing Version & Build Number
        run: |
          BUILD_NUM="${{ github.event.inputs.build_number || github.run_number }}"
          echo "Setting Build Number: $BUILD_NUM"
          cd ios/App
          xcrun agvtool new-version -all $BUILD_NUM

      - name: Substitute Team ID in exportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/\${APPLE_TEAM_ID}/$APPLE_TEAM_ID/g" ios/App/exportOptions.plist
          cat ios/App/exportOptions.plist

      - name: Build Archive (.xcarchive)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/SunnyLearn.xcarchive \
            -allowProvisioningUpdates \
            archive

      - name: Export .ipa for App Store / TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/SunnyLearn.xcarchive \
            -exportOptionsPlist ios/App/exportOptions.plist \
            -exportPath $RUNNER_TEMP/build_output \
            -allowProvisioningUpdates

      - name: Upload Artifact (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: SunnyLearn-iOS-IPA
          path: ${{ runner.temp }}/build_output/*.ipa
          retention-days: 14

      - name: Upload to Apple App Store Connect / TestFlight
        if: env.APP_STORE_CONNECT_API_KEY_BASE64 != ''
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          # Setup App Store Connect API Key directory
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_FILE=$(find $RUNNER_TEMP/build_output -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_FILE to TestFlight..."

          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
